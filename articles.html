<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="浏览知序中的全部文章、学习笔记与灵感记录。">
<title>知序 · 文章列表</title>
<style>
:root{--ink:#20324d;--muted:#72829a;--blue:#2869d8;--line:#e2eaf4;--card:#fff}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(180deg,#eaf4ff 0,#f5f8fd 360px,#f6f8fc 100%);color:var(--ink);font:15px/1.7 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}a{color:inherit;text-decoration:none}.wrap{width:min(1080px,calc(100% - 36px));margin:0 auto}.top{display:flex;align-items:center;gap:16px;padding:26px 0}.brand{font-size:22px;font-weight:800;letter-spacing:.5px}.nav{margin-left:auto;display:flex;gap:18px;color:#536985;font-size:14px}.nav a:hover{color:var(--blue)}.hero{padding:38px 0 24px}.hero h1{font-size:clamp(32px,5vw,46px);margin:0 0 8px;letter-spacing:1px}.hero p{color:var(--muted);margin:0}.tools{display:flex;gap:10px;flex-wrap:wrap;margin:24px 0 20px}.search{flex:1;min-width:220px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:12px 14px;font:inherit;outline:none}.search:focus{border-color:#8bb7f6;box-shadow:0 0 0 3px #2869d814}.filter{border:1px solid var(--line);border-radius:12px;background:#fff;padding:0 12px;font:inherit;color:#4b607d}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;padding-bottom:54px}.card{display:block;background:var(--card);border:1px solid #e6edf6;border-radius:18px;padding:22px;box-shadow:0 8px 26px #26466d08;transition:transform .15s,border-color .15s}.card:hover{transform:translateY(-2px);border-color:#b8d2f6}.meta{display:flex;gap:10px;align-items:center;color:var(--muted);font-size:12px}.tag{display:inline-block;background:#edf5ff;color:#2862b3;border-radius:7px;padding:2px 8px}.card h2{font-size:21px;line-height:1.4;margin:14px 0 8px}.card p{color:#657791;margin:0 0 16px}.tags{display:flex;gap:6px;flex-wrap:wrap}.tags span{font-size:12px;color:#667d9b;background:#f4f7fb;padding:3px 8px;border-radius:6px}.empty,.error{grid-column:1/-1;padding:32px;background:#fff;border:1px solid var(--line);border-radius:16px;color:var(--muted);text-align:center}.footer{border-top:1px solid #e4ebf4;padding:20px 0 30px;color:#8a98ac;font-size:12px}@media(max-width:650px){.grid{grid-template-columns:1fr}.wrap{width:calc(100% - 28px)}.top{padding:20px 0}.nav{gap:12px}}
</style></head>
<body><div class="wrap"><header class="top"><a class="brand" href="index.html">知序</a><nav class="nav"><a href="index.html">首页</a><a href="articles.html" aria-current="page">文章列表</a><a href="editor.html">打开编辑器</a></nav></header>
<section class="hero"><h1>文章列表</h1><p>把思考整理成文，让值得回看的内容在这里汇集。</p></section>
<div class="tools"><input class="search" id="search" type="search" placeholder="搜索标题、摘要、标签……" aria-label="搜索文章"><select class="filter" id="category" aria-label="按分类筛选"><option value="">全部分类</option></select></div>
<main id="list" class="grid"><div class="empty">正在加载文章……</div></main><footer class="footer">知序 · 记录思考，整理灵感</footer></div>
<script>
(function(){const list=document.getElementById('list'),search=document.getElementById('search'),category=document.getElementById('category');let articles=[];function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}function render(){const q=search.value.trim().toLowerCase(),cat=category.value;const data=articles.filter(function(a){return (!cat||a.category===cat)&&(!q||[a.title,a.excerpt,a.category,(a.tags||[]).join(' ')].join(' ').toLowerCase().includes(q))});if(!data.length){list.innerHTML='<div class="empty">没有找到匹配的文章。</div>';return}list.innerHTML=data.map(function(a){return '<a class="card" href="article.html?slug='+encodeURIComponent(a.slug)+'"><div class="meta"><span class="tag">'+esc(a.category||'未分类')+'</span><time>'+esc(a.date||'')+'</time></div><h2>'+esc(a.title)+'</h2><p>'+esc(a.excerpt||'暂无摘要。')+'</p><div class="tags">'+(a.tags||[]).map(function(t){return '<span>'+esc(t)+'</span>'}).join('')+'</div></a>'}).join('')}fetch('articles.json').then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}).then(function(data){if(!Array.isArray(data))throw new Error('文章数据格式不正确');articles=data.slice().sort(function(a,b){return String(b.date||'').localeCompare(String(a.date||''))});Array.from(new Set(articles.map(function(a){return a.category||'未分类'}))).sort().forEach(function(c){const o=document.createElement('option');o.value=c;o.textContent=c;category.appendChild(o)});render()}).catch(function(){list.innerHTML='<div class="error">文章数据加载失败。请确认 articles.json 与本页面位于同一目录，并通过 GitHub Pages 或本地服务器访问。</div>'});search.addEventListener('input',render);category.addEventListener('change',render)})();
</script></body></html>
