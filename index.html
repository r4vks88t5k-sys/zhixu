<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>知序 · 文章</title><meta name="description" content="知序，记录思考，整理灵感，让值得回看的内容在这里汇集。">
<style>
:root{--side:252px;--white:#fff;--pale:#dcecff;--deep:#102e61}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;color:#fff;background:linear-gradient(180deg,#b9dcff 0%,#75afeF 32%,#326fc4 67%,#102d62 100%)}
a{color:inherit;text-decoration:none}.layout{display:flex;height:100vh;width:100%}
.sidebar{width:var(--side);flex:0 0 var(--side);display:flex;flex-direction:column;padding:20px 14px 14px;background:#102b53df;border-right:1px solid #ffffff20;backdrop-filter:blur(16px)}
.brand{display:flex;align-items:center;gap:11px;padding:4px 9px 25px}.logo{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(145deg,#f0f8ff,#a7d1ff);color:#174d91;box-shadow:0 5px 18px #061d4330}.logo svg{width:25px;height:25px}.brand-name{font-size:20px;font-weight:780;letter-spacing:.5px}.brand-sub{display:block;font-size:10px;color:#b7d3f8;letter-spacing:1.5px;margin-top:1px}
.side-btn{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 12px;margin:3px 0;border:1px solid transparent;border-radius:10px;background:transparent;color:#e4efff;font:inherit;font-size:14px;cursor:pointer;text-align:left}.side-btn svg{width:18px;height:18px;flex-shrink:0}.side-btn:hover{background:#ffffff13;border-color:#ffffff12}.side-btn.active{background:#ffffff1c;border-color:#ffffff20}.side-btn.primary{background:#e8f3ff;color:#1c4f91;font-weight:700;box-shadow:0 5px 15px #0b2a5430;margin-bottom:18px}.side-btn.primary:hover{background:#fff}.label{font-size:11px;letter-spacing:1.6px;color:#a9c8f2;padding:4px 12px 9px}.grow{flex:1}.bottom{border-top:1px solid #ffffff20;padding-top:12px}.note{font-size:11px;line-height:1.7;color:#a9c8f2;padding:12px}
.main{position:relative;flex:1;min-width:0;display:flex;align-items:center;justify-content:center;padding:30px;overflow:hidden}.main:before,.main:after{content:"";position:absolute;pointer-events:none;border-radius:50%;filter:blur(2px)}.main:before{width:650px;height:650px;right:-15%;top:-34%;background:radial-gradient(circle,#ffffff35,transparent 68%)}.main:after{width:650px;height:650px;left:-20%;bottom:-48%;background:radial-gradient(circle,#061f5525,transparent 70%)}
.hero{position:relative;z-index:1;text-align:center;max-width:780px;text-shadow:0 3px 24px #0a2c5b20;margin-top:-12px}.hero-mark{width:66px;height:66px;margin:0 auto 25px;border:1px solid #ffffff50;border-radius:22px;background:#ffffff18;display:grid;place-items:center;box-shadow:0 12px 36px #092d6022;backdrop-filter:blur(10px)}.hero-mark svg{width:35px;height:35px}h1{font-size:clamp(42px,6.5vw,76px);letter-spacing:2px;line-height:1.15;margin:0 0 19px;font-weight:780}.hero p{font-size:clamp(15px,1.8vw,19px);line-height:1.9;color:#f0f7ff;margin:0}
.mobile-toggle{display:none}
@media(max-width:700px){.sidebar{position:absolute;z-index:5;left:0;top:0;bottom:0;transform:translateX(-100%);transition:transform .2s;box-shadow:10px 0 40px #061d4350}.sidebar.open{transform:translateX(0)}.mobile-toggle{display:grid;place-items:center;position:absolute;z-index:3;left:14px;top:14px;width:42px;height:42px;border:1px solid #ffffff35;border-radius:12px;background:#12396b45;color:#fff;cursor:pointer}.mobile-toggle svg{width:20px;height:20px}.main{padding:24px}.hero{margin-top:20px}h1{font-size:clamp(38px,10vw,60px)}}
</style></head>
<body><div class="layout">
<aside class="sidebar" id="sidebar">
<a class="brand" href="index.html"><span class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L8 18l-4 1 1-4Z"/><path d="M14 6l4 4"/></svg></span><span><span class="brand-name">知序</span><span class="brand-sub">NOTES &amp; IDEAS</span></span></a>
<button class="side-btn primary" id="createBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>创建新文章</button>
<div class="label">工作区</div>
<a class="side-btn active" href="index.html" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>文章</a>
<a class="side-btn" href="articles.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13"/><path d="M3 6h.01M3 12h.01M3 18h.01"/></svg>文章列表</a>
<div class="grow"></div><div class="bottom"><a class="side-btn" href="editor.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L8 18l-4 1 1-4Z"/></svg>打开编辑器</a><div class="note">记录思考，整理灵感。<br>让每一个想法都有迹可循。</div></div>
</aside>
<main class="main"><button class="mobile-toggle" id="toggle" aria-label="打开侧栏"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
<section class="hero"><div class="hero-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L8 18l-4 1 1-4Z"/><path d="M14 6l4 4"/></svg></div><h1>文章</h1><p>记录思考，整理灵感，<br>让值得回看的内容在这里汇集。</p></section></main></div>
<script>
document.getElementById('createBtn').addEventListener('click',function(){window.location.href='editor.html';});
const sidebar=document.getElementById('sidebar');
document.getElementById('toggle').addEventListener('click',function(){sidebar.classList.toggle('open');});
document.querySelector('.main').addEventListener('click',function(e){if(window.innerWidth<=700&&sidebar.classList.contains('open')&&!e.target.closest('#toggle'))sidebar.classList.remove('open');});
</script></body></html>
