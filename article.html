<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="知序文章阅读页，支持 Markdown 与 LaTeX 数学公式。"><title>知序 · 文章</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.css">
<style>
:root{--ink:#253854;--muted:#74839a;--blue:#2869d8;--line:#e4ebf4}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#eaf4ff 0,#f7f9fc 330px,#f7f9fc 100%);color:var(--ink);font:16px/1.85 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}.wrap{width:min(850px,calc(100% - 32px));margin:0 auto}.top{display:flex;align-items:center;gap:18px;padding:24px 0}.brand{font-weight:800;font-size:21px;text-decoration:none;color:var(--ink)}.nav{margin-left:auto;display:flex;gap:16px;font-size:14px;color:#536985}.nav a{color:inherit;text-decoration:none}.nav a:hover{color:var(--blue)}.article{margin:30px 0 52px;background:#fff;border:1px solid #e6edf6;border-radius:22px;padding:clamp(22px,5vw,54px);box-shadow:0 12px 36px #26466d0b}.meta{color:var(--muted);font-size:13px;display:flex;gap:12px;flex-wrap:wrap}.category{background:#edf5ff;color:#2862b3;border-radius:7px;padding:1px 9px}.article h1{font-size:clamp(30px,5vw,43px);line-height:1.35;letter-spacing:.3px;margin:16px 0 10px}.excerpt{color:#657791;font-size:17px;margin:0 0 30px}.content{overflow-wrap:anywhere}.content h1,.content h2,.content h3,.content h4{line-height:1.4;margin:1.5em 0 .6em}.content h1{font-size:1.8em;border-bottom:1px solid var(--line);padding-bottom:.3em}.content h2{font-size:1.45em;border-bottom:1px solid #edf1f7;padding-bottom:.25em}.content h3{font-size:1.2em}.content p{margin:.9em 0}.content a{color:var(--blue)}.content blockquote{margin:1em 0;padding:.25em 0 .25em 16px;border-left:3px solid #9dbce9;color:#647a98}.content ul,.content ol{padding-left:1.7em}.content li{margin:.25em 0}.content hr{border:0;border-top:1px solid #d9e4f1;margin:1.7em 0}.content pre{background:#f3f6fa;border:1px solid #e7edf5;border-radius:10px;padding:15px;overflow:auto;line-height:1.6}.content code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:.9em}.content :not(pre)>code{background:#f0f4fa;padding:.12em .35em;border-radius:5px}.content img{max-width:100%;height:auto;border-radius:10px}.content table{border-collapse:collapse;width:100%;display:block;overflow:auto}.content th,.content td{border:1px solid #dce5f0;padding:7px 10px;text-align:left}.content th{background:#f5f8fc}.content input[type=checkbox]{margin-right:7px}.tags{display:flex;gap:7px;flex-wrap:wrap;margin-top:30px}.tags span{font-size:12px;color:#667d9b;background:#f4f7fb;padding:3px 9px;border-radius:6px}.bottom{display:flex;justify-content:space-between;gap:12px;border-top:1px solid var(--line);margin-top:36px;padding-top:22px;font-size:14px}.bottom a{color:var(--blue);text-decoration:none}.state{color:var(--muted);padding:28px 0}.footer{color:#8a98ac;font-size:12px;text-align:center;padding:0 0 30px}@media(max-width:540px){.top{padding:18px 0}.nav{gap:10px}.article{margin-top:16px;border-radius:16px}}
</style></head><body><div class="wrap"><header class="top"><a class="brand" href="index.html">知序</a><nav class="nav"><a href="index.html">首页</a><a href="articles.html">文章列表</a><a href="editor.html">编辑器</a></nav></header><main id="main" class="article"><div class="state">正在加载文章……</div></main><footer class="footer">知序 · 记录思考，整理灵感</footer></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase.js"></script><script src="zhixu.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script><script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script><script src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.js"></script><script src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/contrib/auto-render.min.js"></script>
<script>
(async function(){const main=document.getElementById('main');function fail(msg){main.innerHTML='<div class="state">'+Zhixu.esc(msg)+'<p><a href="articles.html" style="color:#2869d8">返回文章列表</a></p></div>'}const slug=new URLSearchParams(location.search).get('slug');if(!slug){fail('没有指定文章。请从文章列表中选择一篇。');return}try{if(!window.zhixuSupabase)throw new Error('Supabase 客户端未加载。');const {data:a,error}=await Zhixu.db().from('articles').select('slug,title,summary,content,category,tags,published_at,created_at').eq('slug',slug).eq('status','published').maybeSingle();if(error)throw error;if(!a){fail('没有找到这篇文章，或文章尚未发布。');return}document.title=(a.title||'文章')+' · 知序';const safe=DOMPurify.sanitize(marked.parse(a.content||''));main.innerHTML='<div class="meta"><span class="category">'+Zhixu.esc(a.category||'未分类')+'</span><time>'+Zhixu.esc(Zhixu.date(a.published_at||a.created_at))+'</time></div><h1>'+Zhixu.esc(a.title||'无标题')+'</h1><p class="excerpt">'+Zhixu.esc(a.summary||'')+'</p><div class="content" id="content">'+safe+'</div><div class="tags">'+(a.tags||[]).map(t=>'<span>'+Zhixu.esc(t)+'</span>').join('')+'</div><div class="bottom"><a href="articles.html">← 返回文章列表</a><a href="index.html">回到首页 ↑</a></div>';if(typeof renderMathInElement==='function')renderMathInElement(document.getElementById('content'),{delimiters:[{left:'$$',right:'$$',display:true},{left:'\\[',right:'\\]',display:true},{left:'\\(',right:'\\)',display:false},{left:'$',right:'$',display:false}],ignoredTags:['script','noscript','style','textarea','pre','code','option'],throwOnError:false})}catch(e){fail('文章加载失败：'+(e.message||'请检查 Supabase 配置和 RLS 策略。'))}})();
</script></body></html>
