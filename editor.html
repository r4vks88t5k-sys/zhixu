<style>

splay:flex;flex-direction:column;background:#fff}.pane-head{height:46px;flex-shrink:0;display:flex;align-items:center;padding:0 16px;border-bottom:1px solid #e8eef6;font-weight:750}.pane-head small{font-size:12px;color:var(--muted);font-weight:450;margin-left:auto}.editor-body{position:relative;flex:1;min-height:0;display:flex;background:#fff}.gutter{flex-shrink:0;width:46px;padding:10px 10px 12px 0;text-align:right;color:#9aa8ba;background:#fbfcfe;border-right:1px solid #edf1f6;overflow:hidden;white-space:pre;font:14px/1.8 ui-monospace,SFMono-Regular,Consolas,monospace;user-select:none}#editor{display:block;flex:1;min-width:0;height:100%;resize:none;border:0;outline:0;padding:10px 14px 12px;background:transparent;color:#203d63;font:14px/1.8 ui-monospace,SFMono-Regular,Consolas,"Microsoft YaHei",monospace;white-space:pre-wrap;overflow-wrap:anywhere;overflow:auto;tab-size:2}.pane-foot{height:34px;flex-shrink:0;display:flex;align-items:center;padding:0 14px;border-top:1px solid #edf1f6;color:var(--muted);font-size:12px}#preview{padding:18px 22px 30px;overflow:auto;flex:1;min-height:0;overflow-wrap:anywhere}#preview h1,#preview h2,#preview h3,#preview h4,#preview h5,#preview h6{color:#203b60;line-height:1.35;margin:1.2em 0 .6em}#preview h1{font-size:1.85em;border-bottom:1px solid #d9e6f6;padding-bottom:.35em;margin-top:.1em}#preview h2{font-size:1.5em;border-bottom:1px solid #e8eef7;padding-bottom:.3em}#preview p{margin:.75em 0}#preview a{color:#2469d4}#preview blockquote{margin:1em 0;padding:.25em 0 .25em 14px;border-left:3px solid #a9c2e6;color:#667e9d}#preview ul,#preview ol{padding-left:1.6em}#preview li{padding-left:.15em;margin:.25em 0}#preview hr{border:0;border-top:1px solid #cbd9eb;margin:1.5em 0}#preview pre{padding:14px;border-radius:9px;background:#f3f6fa;overflow:auto}#preview code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:.92em}#preview :not(pre)>code{background:#f0f4fa;padding:.12em .35em;border-radius:4px}#preview img{max-width:100%;border-radius:8px}#preview table{border-collapse:collapse;width:100%;display:block;overflow:auto}#preview th,#preview td{border:1px solid #dce5f0;padding:7px 10px;text-align:left}#preview th{background:#f5f8fc}#preview input[type=checkbox]{margin-right:7px;accent-color:var(--blue)}
@media(max-width:850px){.app{width:calc(100% - 16px);height:auto;min-height:calc(100vh - 16px);margin:8px;border-radius:14px}.topbar{height:64px;padding:0 14px}.brand{font-size:17px}.toolbar-wrap{padding:8px}.toolbar{gap:5px}.tool{padding:0 9px}.workspace{grid-template-columns:1fr;grid-template-rows:minmax(420px,55vh) minmax(420px,55vh);padding:0 8px 8px;gap:8px}}@media(max-width:480px){.status{display:none}.tool{font-size:12px}.topbar{gap:9px}.logo{width:36px;height:36px}}
</style></head><body><div class="app">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase.js"></script><script src="zhixu.js"></script><script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script><script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script><script src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.js"></script><script src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/contrib/auto-render.min.js"></script>
<script>
(function(){
const editor=document.getElementById('editor'),preview=document.getElementById('preview'),gutter=document.getElementById('gutter'),status=document.getElementById('status'),position=document.getElementById('position'),wordCount=document.getElementById('wordCount');let currentUser=null,currentId=null,dirty=false;
marked.setOptions({gfm:true,breaks:false});
function setStatus(msg,bad){status.innerHTML='<span class="status-dot" style="background:'+(bad?'#d9534f':'#2c9b74')+'"></span><span>'+Zhixu.esc(msg)+'</span>'}
function render(){const source=editor.value;preview.innerHTML=DOMPurify.sanitize(marked.parse(source));if(typeof renderMathInElement==='function')renderMathInElement(preview,{delimiters:[{left:'$$',right:'$$',display:true},{left:'\\[',right:'\\]',display:true},{left:'\\(',right:'\\)',display:false},{left:'$',right:'$',display:false}],ignoredTags:['script','noscript','style','textarea','pre','code','option'],throwOnError:false});updateGutter();updatePosition();wordCount.textContent=source.replace(/\s/g,'').length+' 字';dirty=true}
function updateGutter(){
  const lines=editor.value.split('\n');
  const style=getComputedStyle(editor);
  const lineHeight=parseFloat(style.lineHeight);
  const pl=parseFloat(style.paddingLeft)||0;
  const pr=parseFloat(style.paddingRight)||0;
  const mirror=document.createElement('div');
  mirror.style.cssText='position:absolute;visibility:hidden;left:-100000px;top:0;box-sizing:content-box;white-space:pre-wrap;overflow-wrap:anywhere;tab-size:'+style.tabSize+';font-family:'+style.fontFamily+';font-size:'+style.fontSize+';font-weight:'+style.fontWeight+';font-style:'+style.fontStyle+';letter-spacing:'+style.letterSpacing+';word-spacing:'+style.wordSpacing+';line-height:'+style.lineHeight+';padding:0;border:0;margin:0;width:'+Math.max(0,editor.clientWidth-pl-pr)+'px;min-height:'+lineHeight+'px';
  document.body.appendChild(mirror);
  gutter.innerHTML='';
  for(let i=0;i<lines.length;i++){
    mirror.textContent=lines[i]||'\u200b';
    const h=Math.max(lineHeight,mirror.getBoundingClientRect().height);
    const row=document.createElement('div');
    row.textContent=i+1;
    row.style.height=h+'px';
    row.style.lineHeight=lineHeight+'px';
    row.style.whiteSpace='nowrap';
    row.style.boxSizing='border-box';
    gutter.appendChild(row);
  }
  mirror.remove();
  gutter.scrollTop=editor.scrollTop;
}
function updatePosition(){const lines=editor.value.slice(0,editor.selectionStart).split('\n');position.textContent='行 '+lines.length+'，列 '+(lines[lines.length-1].length+1)}
function lineBounds(){const s=editor.selectionStart,e=editor.selectionEnd,v=editor.value,a=v.lastIndexOf('\n',s-1)+1;let b=v.indexOf('\n',e);if(b<0)b=v.length;return{start:a,end:b,text:v.slice(a,b)}}
function replaceRange(start,end,text,caret){editor.setRangeText(text,start,end,'start');const p=caret===undefined?start+text.length:caret;editor.setSelectionRange(p,p);editor.focus();render()}
function heading(change){const b=lineBounds(),m=b.text.match(/^(\s*)(#{1,6})(?:[ \t]+|$)(.*)$/),indent=m?m[1]:'',count=m?m[2].length:0,content=m?m[3]:b.text.trimStart();let next=count?Math.max(0,Math.min(6,count+change)):3;const hashes='#'.repeat(next),newLine=indent+(next?hashes+(content?' ':''):'')+content;replaceRange(b.start,b.end,newLine,b.start+indent.length+hashes.length+(next&&content?1:0))}
function wrapAtCursor(mark){const s=editor.selectionStart,e=editor.selectionEnd,selected=editor.value.slice(s,e);if(selected){editor.setRangeText(mark+selected+mark,s,e,'select');editor.setSelectionRange(s+mark.length,s+mark.length+selected.length)}else{editor.setRangeText(mark+mark,s,e,'start');editor.setSelectionRange(s+mark.length,s+mark.length)}editor.focus();render()}
function insertPrefix(prefix){const s=editor.selectionStart,v=editor.value,a=v.lastIndexOf('\n',s-1)+1;let b=v.indexOf('\n',s);if(b<0)b=v.length;const line=v.slice(a,b),m=line.match(/^(\s*)(.*)$/),indent=m?m[1]:'',body=m?m[2]:line;replaceRange(a,b,indent+prefix+body,a+indent.length+prefix.length)}
function action(name){if(name==='heading-up'){heading(-1);return}if(name==='heading-down'){heading(1);return}if(name==='hr'){const b=lineBounds();replaceRange(b.start,b.end,'---',b.start+3);return}if(name==='bold'){wrapAtCursor('**');return}if(name==='italic'){wrapAtCursor('*');return}if(name==='strike'){wrapAtCursor('~~');return}if(name==='quote'){insertPrefix('> ');return}if(name==='ul'){insertPrefix('- ');return}if(name==='ol'){insertPrefix('1. ');return}if(name==='task'){insertPrefix('- [ ] ');return}}
document.querySelectorAll('[data-action]').forEach(btn=>{btn.addEventListener('mousedown',e=>e.preventDefault());btn.addEventListener('click',()=>action(btn.dataset.action))});editor.addEventListener('input',render);editor.addEventListener('scroll',()=>gutter.scrollTop=editor.scrollTop);editor.addEventListener('click',updatePosition);editor.addEventListener('keyup',updatePosition);editor.addEventListener('select',updatePosition);editor.addEventListener('keydown',function(e){if(e.key!=='Enter'||editor.selectionStart!==editor.selectionEnd)return;const s=editor.selectionStart,v=editor.value,a=v.lastIndexOf('\n',s-1)+1;let b=v.indexOf('\n',s);if(b<0)b=v.length;const line=v.slice(a,b),quote=line.match(/^(\s*>[ \t]?)/),task=line.match(/^(\s*)([-+*])[ \t]+\[[ xX]\][ \t]+/),ordered=line.match(/^(\s*)(\d+)\.[ \t]+/),unordered=line.match(/^(\s*)([-+*])[ \t]+/);let next='';if(quote)next=quote[1];else if(task)next=task[1]+task[2]+' [ ] ';else if(ordered)next=ordered[1]+(parseInt(ordered[2],10)+1)+'. ';else if(unordered)next=unordered[1]+unordered[2]+' ';if(next){e.preventDefault();editor.setRangeText('\n'+next,s,s,'end');render()}});
const authPanel=document.getElementById('authPanel'),loginBtn=document.getElementById('loginBtn'),logoutBtn=document.getElementById('logoutBtn'),saveBtn=document.getElementById('saveBtn'),publishBtn=document.getElementById('publishBtn'),articleSelect=document.getElementById('articleSelect');
function readFields(){return {title:document.getElementById('titleInput').value.trim(),slug:document.getElementById('slugInput').value.trim().toLowerCase().replace(/[^a-z0-9-]+/g,'-').replace(/^-+|-+$/g,''),category:document.getElementById('categoryInput').value.trim()||'未分类',summary:document.getElementById('summaryInput').value.trim(),content:editor.value}}
function fill(a){currentId=a?a.id:null;document.getElementById('titleInput').value=a?a.title:'';document.getElementById('slugInput').value=a?a.slug:'';document.getElementById('categoryInput').value=a?a.category||'未分类':'未分类';document.getElementById('summaryInput').value=a?a.summary||'':'';editor.value=a?a.content||'':'# 新文章\n\n开始写作……';render();dirty=false}
async function loadMine(){articleSelect.innerHTML='<option value="">新建文章</option>';const {data,error}=await Zhixu.db().from('articles').select('id,slug,title,summary,content,category,tags,status,created_at,updated_at,published_at').order('updated_at',{ascending:false});if(error)throw error;(data||[]).forEach(a=>{const o=document.createElement('option');o.value=a.id;o.textContent=(a.status==='published'?'[已发布] ':'[草稿] ')+(a.title||a.slug);o.dataset.article=JSON.stringify(a);articleSelect.appendChild(o)});const requested=new URLSearchParams(location.search).get('id');const target=requested||currentId;let opt=null;if(target)opt=Array.from(articleSelect.options).find(o=>o.value===target)||null;if(!opt&&articleSelect.options.length>1)opt=articleSelect.options[1];if(opt){articleSelect.value=opt.value;fill(JSON.parse(opt.dataset.article));return}fill(null)}
async function refreshAuth(){const {data,error}=await Zhixu.db().auth.getSession();if(error)throw error;currentUser=data.session&&data.session.user||null;loginBtn.style.display=currentUser?'none':'inline-block';logoutBtn.style.display=currentUser?'inline-block':'none';saveBtn.disabled=!currentUser;publishBtn.disabled=!currentUser;authPanel.style.display='none';if(currentUser){setStatus('已登录：'+(currentUser.email||'管理员'));await loadMine()}else{setStatus('请先登录后保存或发布');articleSelect.innerHTML='<option value="">请登录后加载文章</option>';fill(null)}}
loginBtn.addEventListener('click',()=>{authPanel.style.display=authPanel.style.display==='flex'?'none':'flex'});document.getElementById('doLogin').addEventListener('click',async()=>{const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;if(!email||!password){setStatus('请输入邮箱和密码',true);return}const {error}=await Zhixu.db().auth.signInWithPassword({email,password});if(error){setStatus('登录失败：'+error.message,true);return}await refreshAuth()});logoutBtn.addEventListener('click',async()=>{const {error}=await Zhixu.db().auth.signOut();if(error){setStatus('退出失败：'+error.message,true);return}currentId=null;await refreshAuth()});
articleSelect.addEventListener('change',()=>{if(!articleSelect.value){fill(null);return}const o=articleSelect.selectedOptions[0];if(o.dataset.article)fill(JSON.parse(o.dataset.article))});
async function save(statusValue){if(!currentUser){setStatus('请先登录',true);authPanel.style.display='flex';return}const f=readFields();if(!f.title){setStatus('请填写文章标题',true);return}if(!f.slug){setStatus('请填写英文或数字 slug',true);return}const now=new Date().toISOString();const payload={slug:f.slug,title:f.title,summary:f.summary,content:f.content,category:f.category,status:statusValue,user_id:currentUser.id,updated_at:now,published_at:statusValue==='published'?now:null};if(statusValue==='published'&&currentId){const selected=articleSelect.selectedOptions[0];if(selected&&selected.dataset.article){const prev=JSON.parse(selected.dataset.article);payload.published_at=prev.published_at||now}}let query;if(currentId)query=Zhixu.db().from('articles').update(payload).eq('id',currentId).select().single();else query=Zhixu.db().from('articles').insert(payload).select().single();const {data,error}=await query;if(error){setStatus('保存失败：'+error.message,true);return}currentId=data.id;dirty=false;setStatus(statusValue==='published'?'发布成功':'草稿已保存');await loadMine();articleSelect.value=currentId}
saveBtn.addEventListener('click',()=>save('draft'));publishBtn.addEventListener('click',()=>{if(confirm('确认发布这篇文章？发布后访客可以看到。'))save('published')});
Zhixu.db().auth.onAuthStateChange(()=>{setTimeout(()=>refreshAuth().catch(e=>setStatus('登录状态检查失败：'+e.message,true)),0)});render();refreshAuth().catch(e=>setStatus('连接失败：'+e.message,true));
})();
</script></body></html>
