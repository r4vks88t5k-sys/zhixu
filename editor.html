splay:flex;flex-direction:column;background:#fff}.pane-head{height:46px;flex-shrink:0;display:flex;align-items:center;padding:0 16px;border-bottom:1px solid #e8eef6;font-weight:750}.pane-head small{font-size:12px;color:var(--muted);font-weight:450;margin-left:auto}.editor-body{position:relative;flex:1;min-height:0;display:flex;background:#fff}.gutter{flex-shrink:0;width:46px;padding:10px 10px 12px 0;text-align:right;color:#9aa8ba;background:#fbfcfe;border-right:1px solid #edf1f6;overflow:hidden;white-space:pre;font:14px/1.8 ui-monospace,SFMono-Regular,Consolas,monospace;user-select:none}#editor{display:block;flex:1;min-width:0;height:100%;resize:none;border:0;outline:0;padding:10px 14px 12px;background:transparent;color:#203d63;font:14px/1.8 ui-monospace,SFMono-Regular,Consolas,"Microsoft YaHei",monospace;white-space:pre;overflow:auto;tab-size:2}.pane-foot{height:34px;flex-shrink:0;display:flex;align-items:center;padding:0 14px;border-top:1px solid #edf1f6;color:var(--muted);font-size:12px}#preview{padding:18px 22px 30px;overflow:auto;flex:1;min-height:0;overflow-wrap:anywhere}#preview h1,#preview h2,#preview h3,#preview h4,#preview h5,#preview h6{color:#203b60;line-height:1.35;margin:1.2em 0 .6em}#preview h1{font-size:1.85em;border-bottom:1px solid #d9e6f6;padding-bottom:.35em;margin-top:.1em}#preview h2{font-size:1.5em;border-bottom:1px solid #e8eef7;padding-bottom:.3em}#preview p{margin:.75em 0}#preview a{color:#2469d4}#preview blockquote{margin:1em 0;padding:.25em 0 .25em 14px;border-left:3px solid #a9c2e6;color:#667e9d}#preview ul,#preview ol{padding-left:1.6em}#preview li{padding-left:.15em;margin:.25em 0}#preview hr{border:0;border-top:1px solid #cbd9eb;margin:1.5em 0}#preview pre{padding:14px;border-radius:9px;background:#f3f6fa;overflow:auto}#preview code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:.92em}#preview :not(pre)>code{background:#f0f4fa;padding:.12em .35em;border-radius:4px}#preview img{max-width:100%;border-radius:8px}#pr <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script><script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script><script src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.js"></script><script src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/contrib/auto-render.min.js"></script>
<script>
(function(){
const editor=document.getElementById('editor'),preview=document.getElementById('preview'),gutter=document.getElementById('gutter'),status=document.getElementById('status'),position=document.getElementById('position'),wordCount=document.getElementById('wordCount'),KEY='zhixu-markdown-editor-v1';let saveTimer=null;
marked.setOptions({gfm:true,breaks:false});try{const saved=localStorage.getItem(KEY);if(saved!==null)editor.value=saved}catch(e){}
function render(){const source=editor.value;let html='';try{html=marked.parse(source)}catch(e){html='<p>Markdown 渲染失败，请检查内容。</p>'}preview.innerHTML=DOMPurify.sanitize(html);if(typeof renderMathInElement==='function')renderMathInElement(preview,{delimiters:[{left:'$$',right:'$$',display:true},{left:'\\[',right:'\\]',display:true},{left:'\\(',right:'\\)',display:false},{left:'$',right:'$',display:false}],ignoredTags:['script','noscript','style','textarea','pre','code','option'],throwOnError:false});updateGutter();updatePosition();wordCount.textContent=source.replace(/\s/g,'').length+' 字';scheduleSave()}
function updateGutter(){let n=editor.value.split('\n').length,s='';for(let i=1;i<=n;i++)s+=i+'\n';gutter.textContent=s;gutter.scrollTop=editor.scrollTop}
function updatePosition(){const lines=editor.value.slice(0,editor.selectionStart).split('\n');position.textContent='行 '+lines.length+'，列 '+(lines[lines.length-1].length+1)}
function scheduleSave(){clearTimeout(saveTimer);status.innerHTML='<span class="status-dot" style="background:#e8a23b"></span><span>正在保存到当前浏览器…</span>';saveTimer=setTimeout(saveLocal,350)}
function saveLocal(){try{localStorage.setItem(KEY,editor.value);status.innerHTML='<span class="status-dot"></span><span>已保存到当前浏览器</span>'}catch(e){status.innerHTML='<span class="status-dot" style="background:#d9534f"></span><span>自动保存不可用</span>'}}
document.getElementById('saveBtn').addEventListener('click',function(){saveLocal();const old=this.textContent;this.textContent='已保存 ✓';setTimeout(()=>this.textContent=old,1100)});
function lineBounds(){const s=editor.selectionStart,e=editor.selectionEnd,v=editor.value,a=v.lastIndexOf('\n',s-1)+1;let b=v.indexOf('\n',e);if(b<0)b=v.length;return{start:a,end:b,text:v.slice(a,b)}}
function replaceRange(start,end,text,caret){editor.setRangeText(text,start,end,'start');const p=caret===undefined?start+text.length:caret;editor.setSelectionRange(p,p);editor.focus();render()}
function heading(change){const b=lineBounds(),m=b.text.match(/^(\s*)(#{1,6})(?:[ \t]+|$)(.*)$/),indent=m?m[1]:'',count=m?m[2].length:0,content=m?m[3]:b.text.trimStart();let next=count?Math.max(0,Math.min(6,count+change)):3;const hashes='#'.repeat(next),newLine=indent+(next?hashes+(content?' ':''):'')+content;replaceRange(b.start,b.end,newLine,b.start+indent.length+hashes.length+(next&&content?1:0))}
function wrapAtCursor(mark){const s=editor.selectionStart,e=editor.selectionEnd,selected=editor.value.slice(s,e);if(selected){editor.setRangeText(mark+selected+mark,s,e,'select');editor.setSelectionRange(s+mark.length,s+mark.length+selected.length)}else{editor.setRangeText(mark+mark,s,e,'start');editor.setSelectionRange(s+mark.length,s+mark.length)}editor.focus();render()}
function insertPrefix(prefix){const s=editor.selectionStart,v=editor.value,a=v.lastIndexOf('\n',s-1)+1;let b=v.indexOf('\n',s);if(b<0)b=v.length;const line=v.slice(a,b),m=line.match(/^(\s*)(.*)$/),indent=m?m[1]:'',body=m?m[2]:line;replaceRange(a,b,indent+prefix+body,a+indent.length+prefix.length)}
function action(name){if(name==='heading-up'){heading(-1);return}if(name==='heading-down'){heading(1);return}if(name==='hr'){const b=lineBounds();replaceRange(b.start,b.end,'---',b.start+3);return}if(name==='bold'){wrapAtCursor('**');return}if(name==='italic'){wrapAtCursor('*');return}if(name==='strike'){wrapAtCursor('~~');return}if(name==='quote'){insertPrefix('> ');return}if(name==='ul'){insertPrefix('- ');return}if(name==='ol'){insertPrefix('1. ');return}if(name==='task'){insertPrefix('- [ ] ');return}}
document.querySelectorAll('[data-action]').forEach(btn=>{btn.addEventListener('mousedown',e=>e.preventDefault());btn.addEventListener('click',()=>action(btn.dataset.action))});
editor.addEventListener('input',render);editor.addEventListener('scroll',()=>gutter.scrollTop=editor.scrollTop);editor.addEventListener('click',updatePosition);editor.addEventListener('keyup',updatePosition);editor.addEventListener('select',updatePosition);
editor.addEventListener('keydown',function(e){if(e.key!=='Enter'||editor.selectionStart!==editor.selectionEnd)return;const s=editor.selectionStart,v=editor.value,a=v.lastIndexOf('\n',s-1)+1;let b=v.indexOf('\n',s);if(b<0)b=v.length;const line=v.slice(a,b),quote=line.match(/^(\s*>[ \t]?)/),task=line.match(/^(\s*)([-+*])[ \t]+\[[ xX]\][ \t]+/),ordered=line.match(/^(\s*)(\d+)\.[ \t]+/),unordered=line.match(/^(\s*)([-+*])[ \t]+/);let next='';if(quote)next=quote[1];else if(task)next=task[1]+task[2]+' [ ] ';else if(ordered)next=ordered[1]+(parseInt(ordered[2],10)+1)+'. ';else if(unordered)next=unordered[1]+unordered[2]+' ';if(next){e.preventDefault();editor.setRangeText('\n'+next,s,s,'end');render()}});render();
})();
