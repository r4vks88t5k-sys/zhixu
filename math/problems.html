<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#edf5ff">
<title>数学题库 · 知序</title>
<style>
:root{--bg:#f3f7fc;--line:#dce6f2;--ink:#20324d;--muted:#71829b;--blue:#2869d8;--blue-dark:#174fae;--soft:#edf5ff;--shadow:0 12px 34px #26466d12}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;background:linear-gradient(180deg,#e5f1ff 0,#f3f7fc 350px,#f3f7fc 100%);color:var(--ink);font:15px/1.7 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}
a{color:inherit;text-decoration:none}button,input,select{font:inherit}.layout{width:min(1480px,calc(100% - 32px));min-height:calc(100vh - 32px);margin:16px auto;display:grid;grid-template-columns:224px minmax(0,1fr);gap:18px}.sidebar,.panel{background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}.sidebar{padding:22px 14px;display:flex;flex-direction:column;gap:7px}.brand{display:flex;align-items:center;gap:11px;padding:0 9px 22px}.logo{width:42px;height:42px;display:grid;place-items:center;border-radius:13px;background:linear-gradient(145deg,#e6f2ff,#b5d6ff);color:#174d91;font-size:22px;font-weight:800}.brand-name{font-size:21px;font-weight:800;letter-spacing:.03em}.brand-sub{display:block;font-size:10px;letter-spacing:1.5px;color:#8296b2;margin-top:-2px}.nav-label{padding:8px 12px 4px;color:#8a9ab0;font-size:11px;letter-spacing:1.5px}.nav{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:11px;color:#455b78}.nav:hover,.nav.active{background:#eaf2ff;color:var(--blue-dark)}.side-note{margin-top:auto;padding:13px 10px 4px;border-top:1px solid var(--line);color:var(--muted);font-size:12px;line-height:1.8}.main{min-width:0;padding:8px 0 24px}.topline{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:8px 4px 24px}.crumb{font-size:13px;color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 13px;border:1px solid var(--line);border-radius:11px;background:#fff;color:var(--ink);cursor:pointer;white-space:nowrap}.btn:hover{background:#f4f8ff;border-color:#bfd4f1;text-decoration:none}.btn.primary{background:var(--blue);border-color:var(--blue);color:white}.btn.primary:hover{background:var(--blue-dark)}.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin:0 4px 25px}.eyebrow{font-size:11px;letter-spacing:2px;font-weight:750;color:#4779bb;margin-bottom:8px}.hero h1{font-size:clamp(32px,4vw,46px);letter-spacing:-.035em;line-height:1.2;margin:0 0 11px}.hero p{margin:0;color:#607590;max-width:650px;font-size:14px}.hero-count{flex-shrink:0;min-width:105px;padding:14px 17px;border:1px solid #d3e4f8;background:#ffffffa8;border-radius:16px;text-align:center}.hero-count strong{display:block;font-size:25px;line-height:1.3;color:#225bb0}.hero-count span{font-size:12px;color:var(--muted)}.panel{overflow:hidden;margin-bottom:16px}.filter-panel{padding:19px}.search-row{display:flex;gap:10px}.search-wrap{position:relative;flex:1;min-width:0}.search-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:#8a9bb2}.search{width:100%;height:46px;border:1px solid var(--line);border-radius:12px;padding:0 14px 0 42px;background:#fbfdff;color:var(--ink);outline:none}.search:focus{border-color:#8eb6ef;box-shadow:0 0 0 3px #2869d814}.filter-row{display:flex;align-items:flex-start;gap:12px;margin-top:16px}.filter-label{flex:0 0 66px;padding-top:5px;color:#687e9a;font-size:12px;font-weight:700}.chips{display:flex;flex:1;flex-wrap:wrap;gap:7px;min-width:0}.chip{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;border:1px solid #dce6f2;border-radius:999px;background:#fff;color:#526985;font-size:12px;cursor:pointer;transition:.15s}.chip:hover{border-color:#9fc1f0;background:#f5f9ff}.chip.selected{border-color:#9abdf0;background:#e9f2ff;color:#2057a7;font-weight:700}.chip .check{display:none}.chip.selected .check{display:inline}.filter-bottom{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:16px;padding-top:14px;border-top:1px solid #edf1f7}.filter-note{font-size:12px;color:var(--muted)}.filter-actions{display:flex;gap:8px;align-items:center}.select{height:36px;padding:0 10px;border:1px solid var(--line);border-radius:9px;background:white;color:#526985;font-size:12px}.results-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:22px 4px 12px}.results-head h2{font-size:17px;margin:0}.results-sub{font-size:12px;color:var(--muted);margin-top:3px}.sort{height:36px;border:1px solid var(--line);border-radius:10px;background:#fff;color:#526985;padding:0 10px;font-size:12px}.list{display:flex;flex-direction:column;gap:10px}.problem-card{display:flex;gap:16px;align-items:flex-start;padding:19px;background:rgba(255,255,255,.95);border:1px solid var(--line);border-radius:16px;box-shadow:0 5px 18px #26466d08;transition:border-color .15s,transform .15s}.problem-card:hover{border-color:#a8c7f2;transform:translateY(-1px)}.problem-no{flex:0 0 84px;min-height:42px;display:flex;align-items:center;justify-content:center;padding:8px 7px;border:1px solid #d6e6fb;border-radius:11px;background:#eff6ff;color:#245ca9;font-size:14px;font-weight:800;font-variant-numeric:tabular-nums}.problem-body{flex:1;min-width:0}.problem-title{font-size:17px;line-height:1.5;font-weight:750;margin:0 0 5px;color:#233a59;overflow-wrap:anywhere}.problem-title a:hover{color:var(--blue);text-decoration:none}.problem-desc{font-size:13px;color:#687d98;line-height:1.8;margin:0 0 11px;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.meta{display:flex;align-items:center;gap:7px;flex-wrap:wrap}.tag{display:inline-flex;align-items:center;padding:3px 9px;border:1px solid #e0e8f3;border-radius:999px;background:#f8fbff;color:#627894;font-size:11px;line-height:1.5}.tag.source{background:#f6f8fb}.tag.difficulty{background:#fff8eb;border-color:#f4e3bf;color:#9a6a1e}.card-arrow{flex:0 0 auto;color:#9aabc0;font-size:22px;padding-top:4px}.empty{padding:42px 20px;text-align:center;background:#fff;border:1px dashed #d4e0ef;border-radius:16px;color:var(--muted)}.empty strong{display:block;color:#3c5270;font-size:15px;margin-bottom:6px}.empty .btn{margin-top:13px}.error{background:#fff6f4;border-color:#f1d0cb;color:#9f4035}.status-line{padding:12px 14px;border-radius:11px;background:#f7faff;color:var(--muted);font-size:13px}.pagination{display:flex;align-items:center;justify-content:center;gap:7px;flex-wrap:wrap;padding:20px 0 5px}.page-btn{min-width:36px;height:36px;padding:0 10px;border:1px solid var(--line);border-radius:10px;background:#fff;color:#526985;cursor:pointer}.page-btn:disabled{opacity:.4;cursor:not-allowed}.page-btn.active{background:var(--blue);border-color:var(--blue);color:white}.footer{text-align:center;color:#8a9bb2;font-size:12px;padding:18px 0 5px}.mobile-menu{display:none}
@media(max-width:850px){.layout{grid-template-columns:190px minmax(0,1fr);gap:12px;width:calc(100% - 20px);margin:10px auto}.sidebar{padding:17px 10px}.main{padding-top:5px}.hero{align-items:flex-start}.hero-count{min-width:82px;padding:10px}.hero-count strong{font-size:21px}}
@media(max-width:650px){.layout{display:block;width:calc(100% - 20px);margin:10px auto}.sidebar{display:grid;grid-template-columns:1fr 1fr;gap:5px;padding:12px;margin-bottom:10px;border-radius:15px}.brand{grid-column:1/-1;padding:2px 8px 8px}.nav-label,.side-note{display:none}.nav{padding:9px 10px;font-size:13px}.main{padding:3px 0 20px}.topline{align-items:flex-start;margin:8px 3px 20px}.crumb{font-size:12px}.topline .actions .btn{font-size:12px;padding:7px 9px}.hero{gap:10px;margin-bottom:18px}.hero h1{font-size:32px}.hero p{font-size:13px}.hero-count{min-width:72px;padding:9px 7px}.hero-count span{font-size:10px}.filter-panel{padding:13px}.search-row{gap:7px}.search{height:43px}.filter-row{gap:7px}.filter-label{flex-basis:55px}.filter-bottom{align-items:flex-start;flex-direction:column}.filter-actions{width:100%;justify-content:space-between}.problem-card{padding:13px;gap:10px}.problem-no{flex-basis:68px;font-size:12px;padding:7px 4px}.problem-title{font-size:15px}.problem-desc{font-size:12px}.card-arrow{display:none}.results-head{align-items:flex-start}.results-head h2{font-size:16px}}
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <a class="brand" href="../index.html"><span class="logo">知</span><span><span class="brand-name">知序</span><span class="brand-sub">NOTES &amp; IDEAS</span></span></a>
    <div class="nav-label">工作区</div>
    <a class="nav" href="../index.html">▤　文章首页</a>
    <a class="nav" href="../articles.html">☷　文章列表</a>
    <a class="nav" href="./index.html">⌘　数学知识树</a>
    <a class="nav active" href="./problems.html">▤　数学题库</a>
    <a class="nav" href="./editor.html">✎　数学编辑器</a>
    <div class="side-note">一道题可以有多个标签，也可以连接多个知识点。让题目、方法与思路彼此照亮。</div>
  </aside>
  <main class="main">
    <div class="topline">
      <div class="crumb"><a href="./index.html">数学知识树</a>　/　题库</div>
      <div class="actions"><a class="btn" href="./index.html">返回知识树</a><a class="btn primary" href="./editor.html?type=problem">＋ 新建题目</a></div>
    </div>
    <header class="hero">
      <div><div class="eyebrow">MATHEMATICS · PROBLEM BANK</div><h1>数学题库</h1><p>按题号整理题目，用标签快速筛选；从一道题出发，继续探索背后的知识与方法。</p></div>
      <div class="hero-count"><strong id="totalCount">—</strong><span>道已发布题目</span></div>
    </header>
    <section class="panel filter-panel" aria-label="题目搜索与筛选">
      <div class="search-row"><div class="search-wrap"><span class="search-icon">⌕</span><input class="search" id="searchInput" type="search" placeholder="搜索题号、题目名称、题面或来源……" autocomplete="off" aria-label="搜索题目"></div><button class="btn" id="clearSearch" type="button">清空</button></div>
      <div class="filter-row"><label class="filter-label" for="difficultyFilter">难度筛选</label><select class="select" id="difficultyFilter" aria-label="按难度筛选"><option value="">全部难度</option><option value="introductory">入门</option><option value="league_easy">联赛易</option><option value="league_medium">联赛中</option><option value="league_hard">联赛难</option><option value="training_easy">集训队易</option><option value="training_hard">集训队难</option><option value="extreme">极难</option></select></div>
      <div class="filter-row"><div class="filter-label">标签筛选</div><div class="chips" id="tagFilters"><span class="filter-note">正在读取标签……</span></div></div>
      <div class="filter-bottom"><div class="filter-note" id="filterHint">多选标签时采用 AND 逻辑：题目必须包含所有选中的标签。</div><div class="filter-actions"><button class="btn" id="clearTags" type="button">清除标签</button><select class="select" id="pageSize" aria-label="每页显示题目数"><option value="20">每页 20 道</option><option value="30" selected>每页 30 道</option><option value="50">每页 50 道</option></select></div></div>
    </section>
    <div class="results-head"><div><h2>全部题目</h2><div class="results-sub" id="resultsSummary">正在连接题库……</div></div><select class="sort" id="sortOrder" aria-label="题号排序"><option value="asc">题号升序</option><option value="desc">题号降序</option></select></div>
    <section id="problemList" class="list" aria-live="polite"><div class="status-line">正在从 Supabase 加载已发布题目……</div></section>
    <nav class="pagination" id="pagination" aria-label="题库分页"></nav>
    <footer class="footer">知序 · 数学题库</footer>
  </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../supabase.js"></script>
<script>
(function(){
  'use strict';
  const $=id=>document.getElementById(id);
  const db=window.zhixuSupabase;
  const state={problems:[],tags:[],links:[],selectedTags:new Set(),page:1,pageSize:30,sort:'asc',search:'',difficulty:'',tagLoadError:''};
  const difficultyNames={introductory:'入门',league_easy:'联赛易',league_medium:'联赛中',league_hard:'联赛难',training_easy:'集训队易',training_hard:'集训队难',extreme:'极难',basic:'入门',intermediate:'联赛易',advanced:'联赛难'};
  function esc(value){return String(value==null?'':value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
  function cleanText(value){return String(value||'').replace(/```[\s\S]*?```/g,' ').replace(/`([^`]+)`/g,'$1').replace(/!\[[^\]]*\]\([^)]*\)/g,' ').replace(/\[([^\]]+)\]\([^)]*\)/g,'$1').replace(/[#>*_~$\\]/g,' ').replace(/\s+/g,' ').trim();}
  function formatNo(problem){const n=Number(problem.problem_no);return Number.isFinite(n)&&n>0?'P'+n:'题号待分配';}
  function problemTags(problemId){const ids=state.links.filter(x=>x.problem_id===problemId).map(x=>x.tag_id);return state.tags.filter(t=>ids.includes(t.id));}
  function renderTagFilters(){
    const box=$('tagFilters');
    if(!state.tags.length){box.innerHTML='<span class="filter-note">暂时没有可用标签；可以先在编辑器中给题目添加标签。</span>';return;}
    box.innerHTML=state.tags.map(t=>'<button type="button" class="chip'+(state.selectedTags.has(t.id)?' selected':'')+'" data-tag-id="'+esc(t.id)+'" aria-pressed="'+state.selectedTags.has(t.id)+'"><span class="check">✓</span>'+esc(t.name)+'</button>').join('');
    box.querySelectorAll('[data-tag-id]').forEach(button=>button.addEventListener('click',()=>{const id=button.getAttribute('data-tag-id');if(state.selectedTags.has(id))state.selectedTags.delete(id);else state.selectedTags.add(id);state.page=1;renderTagFilters();renderProblems();}));
  }
  function matchesSearch(p){if(!state.search)return true;const haystack=[formatNo(p),p.problem_no,p.title,p.slug,p.statement,p.answer,p.solution,p.source,p.difficulty].join(' ').toLocaleLowerCase();return haystack.includes(state.search.toLocaleLowerCase());}
  function matchesDifficulty(p){return !state.difficulty||p.difficulty===state.difficulty;}
  function matchesTags(p){if(!state.selectedTags.size)return true;const ids=new Set(state.links.filter(x=>x.problem_id===p.id).map(x=>x.tag_id));for(const id of state.selectedTags){if(!ids.has(id))return false;}return true;}
  function renderCard(p){
    const tags=problemTags(p);const desc=cleanText(p.statement||p.summary||'');
    const meta=[];
    if(p.source)meta.push('<span class="tag source">'+esc(p.source)+'</span>');
    if(p.difficulty)meta.push('<span class="tag difficulty">'+esc(difficultyNames[p.difficulty]||p.difficulty)+'</span>');
    tags.forEach(t=>meta.push('<span class="tag">'+esc(t.name)+'</span>'));
    if(!tags.length)meta.push('<span class="tag">暂无标签</span>');
    return '<article class="problem-card"><a class="problem-no" href="./problem.html?id='+encodeURIComponent(p.id)+'" aria-label="查看'+esc(formatNo(p))+'">'+esc(formatNo(p))+'</a><div class="problem-body"><h3 class="problem-title"><a href="./problem.html?id='+encodeURIComponent(p.id)+'">'+esc(p.title||'未命名题目')+'</a></h3><p class="problem-desc">'+esc(desc||'暂无题面摘要。')+'</p><div class="meta">'+meta.join('')+'</div></div><a class="card-arrow" href="./problem.html?id='+encodeURIComponent(p.id)+'" aria-label="查看题目">›</a></article>';
  }
  function renderPagination(totalPages){
    const nav=$('pagination');if(totalPages<=1){nav.innerHTML='';return;}
    let html='<button class="page-btn" data-page="'+(state.page-1)+'" '+(state.page<=1?'disabled':'')+'>上一页</button>';
    let pages=[];for(let i=1;i<=totalPages;i++){if(i===1||i===totalPages||Math.abs(i-state.page)<=1)pages.push(i);}
    let prev=0;pages.forEach(p=>{if(prev&&p-prev>1)html+='<span class="filter-note">…</span>';html+='<button class="page-btn'+(p===state.page?' active':'')+'" data-page="'+p+'" '+(p===state.page?'aria-current="page"':'')+'>'+p+'</button>';prev=p;});
    html+='<button class="page-btn" data-page="'+(state.page+1)+'" '+(state.page>=totalPages?'disabled':'')+'>下一页</button>';
    nav.innerHTML=html;nav.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>{const p=Number(b.dataset.page);if(p>=1&&p<=totalPages){state.page=p;renderProblems();window.scrollTo({top:$('resultsSummary').getBoundingClientRect().top+window.scrollY-100,behavior:'smooth'});}}));
  }
  function renderProblems(){
    const list=$('problemList');let items=state.problems.filter(matchesSearch).filter(matchesDifficulty).filter(matchesTags);
    items.sort((a,b)=>state.sort==='asc'?Number(a.problem_no)-Number(b.problem_no):Number(b.problem_no)-Number(a.problem_no));
    const total=items.length,totalPages=Math.max(1,Math.ceil(total/state.pageSize));if(state.page>totalPages)state.page=totalPages;
    $('totalCount').textContent=state.problems.length;
    $('resultsSummary').textContent='找到 '+total+' 道题'+(state.difficulty?' · 难度：'+(difficultyNames[state.difficulty]||state.difficulty):'')+(state.selectedTags.size?' · 已选 '+state.selectedTags.size+' 个标签（AND）':'')+(state.search?' · 搜索：'+state.search:'');
    if(!total){
      const hasFilters=!!state.search||!!state.difficulty||state.selectedTags.size>0;
      list.innerHTML='<div class="empty"><strong>'+(hasFilters?'没有找到符合条件的题目':'题库暂时还没有已发布题目')+'</strong>'+(hasFilters?'试试减少关键词或清除部分标签。':'在数学编辑器中创建题目并发布后，它们就会出现在这里。')+'<br>'+(hasFilters?'<button class="btn" id="emptyClear" type="button">清除筛选条件</button>':'<a class="btn primary" href="./editor.html?type=problem">＋ 创建第一道题</a>')+'</div>';
      const clear=$('emptyClear');if(clear)clear.addEventListener('click',clearAllFilters);navClear();return;
    }
    const start=(state.page-1)*state.pageSize;list.innerHTML=items.slice(start,start+state.pageSize).map(renderCard).join('');renderPagination(totalPages);
  }
  function navClear(){$('pagination').innerHTML='';}
  function clearAllFilters(){state.search='';state.difficulty='';state.selectedTags.clear();state.page=1;$('searchInput').value='';$('difficultyFilter').value='';renderTagFilters();renderProblems();}
  async function load(){
    if(!db){$('problemList').innerHTML='<div class="empty error"><strong>无法连接 Supabase</strong>请检查网络连接，以及 math/problems.html 中的 ../supabase.js 路径。</div>';$('resultsSummary').textContent='连接失败';$('totalCount').textContent='!';return;}
    try{
      const result=await db.from('problems').select('id,problem_no,slug,title,statement,answer,solution,difficulty,source,status,created_at').eq('status','published').order('problem_no',{ascending:true});
      if(result.error)throw result.error;state.problems=result.data||[];
      const [tagResult,linkResult]=await Promise.all([
        db.from('tags').select('id,name,slug').order('name',{ascending:true}),
        db.from('problem_tags').select('problem_id,tag_id')
      ]);
      if(tagResult.error||linkResult.error){state.tagLoadError=(tagResult.error||linkResult.error).message;console.warn('标签读取失败：',state.tagLoadError);state.tags=[];state.links=[];}
      else{state.tags=tagResult.data||[];state.links=linkResult.data||[];}
      renderTagFilters();renderProblems();
      if(state.tagLoadError){$('filterHint').textContent='题目已加载，但标签暂时无法读取：'+state.tagLoadError;}
    }catch(error){
      console.error('题库加载失败：',error);
      const message=String(error&&error.message||error);
      const likelyColumn=message.includes('problem_no');
      $('problemList').innerHTML='<div class="empty error"><strong>题库加载失败</strong>'+(likelyColumn?'数据库尚未正确添加 problem_no 字段。':'请检查 Supabase 连接、problems 表字段、SELECT 权限和 RLS。')+'<br><span>'+esc(message)+'</span></div>';
      $('resultsSummary').textContent='加载失败';$('totalCount').textContent='!';
    }
  }
  let searchTimer=null;
  $('searchInput').addEventListener('input',()=>{clearTimeout(searchTimer);searchTimer=setTimeout(()=>{state.search=$('searchInput').value.trim();state.page=1;renderProblems();},120);});
  $('clearSearch').addEventListener('click',()=>{$('searchInput').value='';state.search='';state.page=1;renderProblems();$('searchInput').focus();});
  $('clearTags').addEventListener('click',()=>{state.selectedTags.clear();state.page=1;renderTagFilters();renderProblems();});
  $('difficultyFilter').addEventListener('change',()=>{state.difficulty=$('difficultyFilter').value;state.page=1;renderProblems();});
  $('pageSize').addEventListener('change',()=>{state.pageSize=Number($('pageSize').value)||30;state.page=1;renderProblems();});
  $('sortOrder').addEventListener('change',()=>{state.sort=$('sortOrder').value;state.page=1;renderProblems();});
  load();
})();
</script>
</body>
</html>
