<head>

<style>
:root{--side:252px;--ink:#20324d;--muted:#71829b;--line:#dce6f2}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;color:var(--ink)}
body{background:linear-gradient(180deg,#b9dcff 0%,#75afef 32%,#326fc4 67%,#102d62 100%);background-attachment:fixed}
a{color:inherit;text-decoration:none}.layout{display:flex;min-height:100vh;width:100%}
.sidebar{width:var(--side);flex:0 0 var(--side);display:flex;flex-direction:column;padding:20px 14px 14px;background:#102b53df;border-right:1px solid #ffffff20;backdrop-filter:blur(16px)}
.brand{display:flex;align-items:center;gap:11px;padding:4px 9px 25px;color:#fff}.logo{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(145deg,#f0f8ff,#a7d1ff);color:#174d91;font-size:23px}.brand-name{font-size:20px;font-weight:780}.brand-sub{display:block;font-size:10px;color:#b7d3f8;letter-spacing:1.5px;margin-top:1px}
.side-btn{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 12px;margin:3px 0;border:1px solid transparent;border-radius:10px;color:#e4efff;font-size:14px}.side-btn:hover,.side-btn.active{background:#ffffff1c}.label{font-size:11px;letter-spacing:1.6px;color:#a9c8f2;padding:10px 12px}.grow{flex:1}.note{font-size:11px;line-height:1.7;color:#a9c8f2;padding:12px;border-top:1px solid #ffffff20}
.main{flex:1;min-width:0;padding:34px;overflow:hidden}.content{max-width:1050px;margin:0 auto}.topline{display:flex;justify-content:space-between;gap:12px;margin-bottom:24px;color:#eff7ff;font-size:13px}.topline a{padding:8px 12px;border:1px solid #ffffff50;border-radius:10px;background:#ffffff15}
.hero{margin-bottom:26px;color:#fff}.eyebrow{font-size:12px;letter-spacing:2px;color:#e2efff;margin-bottom:10px}h1{font-size:clamp(34px,5vw,54px);line-height:1.2;margin:0 0 12px;font-weight:780}.hero p{font-size:15px;line-height:1.8;color:#f0f7ff;margin:0;max-width:680px}
.panel{background:#ffffffed;border:1px solid #ffffff9c;border-radius:20px;box-shadow:0 16px 45px #092b5c20;overflow:hidden}.panel-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:20px 22px;border-bottom:1px solid var(--line)}.panel-head h2{font-size:17px;margin:0}.panel-head p{font-size:12px;color:var(--muted);margin:5px 0 0}.count{font-size:12px;color:#315d9d;background:#eaf3ff;border-radius:999px;padding:6px 10px;white-space:nowrap}
#tree{padding:12px 14px 18px}.category{border:1px solid transparent;border-radius:13px;margin:5px 0;overflow:hidden}.category.open{background:#f8fbff;border-color:#e4edf8}.category-head{display:flex;align-items:center;gap:10px;width:100%;padding:14px 12px;border:0;background:transparent;text-align:left;font:inherit;cursor:pointer;color:var(--ink)}.category-head:hover{background:#edf5ff}.chevron{width:24px;height:24px;display:grid;place-items:center;border-radius:7px;background:#eaf2ff;color:#3568ad;flex-shrink:0;transition:transform .15s}.category.open .chevron{transform:rotate(90deg)}.cat-icon{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(145deg,#e6f2ff,#c6e0ff);color:#255da9;font-weight:800;flex-shrink:0}.cat-info{flex:1;min-width:0}.cat-title{display:block;font-size:15px;font-weight:750}.cat-sub{display:block;color:var(--muted);font-size:12px;margin-top:3px}.cat-count{font-size:12px;color:#7285a0;white-space:nowrap}.children{padding:0 14px 14px 52px;display:none}.category.open .children{display:block}.node-link{display:flex;gap:10px;padding:11px 12px;border-radius:10px;border:1px solid transparent}.node-link:hover{background:#edf5ff;border-color:#d9e8fb}.node-dot{width:8px;height:8px;margin-top:6px;border-radius:50%;background:#6da3e8;flex-shrink:0}.node-text{min-width:0;flex:1}.node-title{font-size:14px;font-weight:650}.node-summary{font-size:12px;color:var(--muted);line-height:1.6;margin-top:4px}.node-empty{font-size:12px;color:var(--muted);padding:12px}.state{padding:28px 18px;text-align:center;color:var(--muted);font-size:14px;line-height:1.8}.state.error{color:#9b3e49}.footer-note{color:#eaf4ff;font-size:12px;line-height:1.8;margin:18px 4px 0}
.mobile-toggle{display:none}
@media(max-width:760px){.layout{display:block}.sidebar{position:fixed;z-index:10;left:0;top:0;bottom:0;transform:translateX(-100%);transition:transform .2s;box-shadow:10px 0 40px #061d4350}.sidebar.open{transform:translateX(0)}.mobile-toggle{display:grid;place-items:center;position:fixed;z-index:8;left:14px;top:14px;width:42px;height:42px;border:1px solid #ffffff55;border-radius:12px;background:#12396b9c;color:#fff}.main{padding:76px 15px 24px}.topline{justify-content:flex-end}.crumb{display:none}.panel-head{padding:17px}.children{padding-left:30px}.cat-count{display:none}}
</style>
</head>
<body><div class="layout">
<aside class="sidebar" id="sidebar">
<a class="brand" href="../index.html"><span class="logo">知</span><span><span class="brand-name">知序</span><span class="brand-sub">NOTES &amp; IDEAS</span></span></a>
<div class="label">工作区</div>
<a class="side-btn" href="../index.html">▤　文章</a><a class="side-btn" href="../articles.html">☷　文章列表</a><a class="side-btn active" href="index.html">⑂　数学知识树</a>
<div class="grow"></div><div class="note"><a class="side-btn" href="../editor.html">✎　打开文章编辑器</a>整理知识，连接方法。<br>让每一个思路都有迹可循。</div>
</aside>
<main class="main"><button class="mobile-toggle" id="toggle" aria-label="打开侧栏">☰</button><div class="content">
<div class="topline"><span class="crumb">知序 / 学科知识库 / 数学</span><a href="../index.html">返回文章首页 ↗</a></div>
<header class="hero"><div class="eyebrow">MATHEMATICS · KNOWLEDGE MAP</div><h1>数学知识树</h1><p>以初高中竞赛数学为主线，从宽泛的知识目录出发，逐步整理概念、方法与典型题目。</p></header>
<section class="panel"><div class="panel-head"><div><h2>知识目录</h2><p>选择一个分类，展开查看下级知识点。</p></div><span class="count" id="node-count">正在读取</span></div><div id="tree"><div class="state">正在从知识库加载目录……</div></div></section>
<div class="footer-note">目录内容来自 Supabase 中状态为 published 的知识点。后续可逐步添加知识说明、关联知识与竞赛题目。</div>
</div></main></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../supabase.js"></script>
<script>
(function(){
const sidebar=document.getElementById('sidebar');
document.getElementById('toggle').addEventListener('click',function(){sidebar.classList.toggle('open');});
document.querySelector('.main').addEventListener('click',function(e){if(window.innerWidth<=760&&sidebar.classList.contains('open')&&!e.target.closest('#toggle'))sidebar.classList.remove('open');});
const tree=document.getElementById('tree'),count=document.getElementById('node-count');
const icons={'代数':'A','几何':'G','数论':'N','组合数学':'C','概率与统计':'P','数学方法与综合专题':'M'};
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function renderNode(n){return '<a class="node-link" href="knowledge.html?id='+encodeURIComponent(n.id)+'"><span class="node-dot"></span><span class="node-text"><span class="node-title">'+esc(n.title)+'</span>'+(n.summary?'<div class="node-summary">'+esc(n.summary)+'</div>':'')+'</span></a>';}
function render(nodes){
const groups={};nodes.forEach(function(n){const k=n.parent_id||'root';if(!groups[k])groups[k]=[];groups[k].push(n);});
const roots=groups.root||[];if(!roots.length){tree.innerHTML='<div class="state">目前还没有已发布的知识点，请先添加知识目录。</div>';count.textContent='0 个知识点';return;}
let html='';roots.forEach(function(r,i){const children=groups[r.id]||[];html+='<section class="category'+(i===0?' open':'')+'"><button class="category-head" type="button" aria-expanded="'+(i===0?'true':'false')+'"><span class="chevron">›</span><span class="cat-icon">'+esc(icons[r.title]||r.title.slice(0,1))+'</span><span class="cat-info"><span class="cat-title">'+esc(r.title)+'</span><span class="cat-sub">'+esc(r.summary||'查看该分类下的知识点')+'</span></span><span class="cat-count">'+children.length+' 个子项</span></button><div class="children">'+(children.map(renderNode).join('')||'<div class="node-empty">该分类暂时还没有下级知识点。</div>')+'</div></section>';});
tree.innerHTML=html;tree.querySelectorAll('.category-head').forEach(function(b){b.addEventListener('click',function(){const s=b.closest('.category'),open=s.classList.toggle('open');b.setAttribute('aria-expanded',open?'true':'false');});});count.textContent=nodes.length+' 个知识点';
}
async function load(){try{if(!window.zhixuSupabase)throw new Error('Supabase 客户端未初始化');const r=await window.zhixuSupabase.from('knowledge_nodes').select('id,parent_id,slug,title,summary,node_type,sort_order,status').eq('status','published').order('sort_order',{ascending:true}).order('title',{ascending:true});if(r.error)throw r.error;render(r.data||[]);}catch(e){console.error('数学知识树加载失败：',e);tree.innerHTML='<div class="state error">知识目录加载失败。请检查网络、Supabase 表权限与 RLS 策略，并查看浏览器控制台。</div>';count.textContent='加载失败';}}
load();
})();
</script></body></html>
